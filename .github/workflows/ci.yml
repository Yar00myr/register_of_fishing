name: Django CI

on:
  push:
  pull_request:
    branches: ["main", "dev"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Check
        run: ruff check . --exclude "**/migrations/*" --fix

      - name: Run Ruff Format
        run: ruff format . --exclude "**/migrations/*"

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          cd project
          pip install -r requirements.txt
          pip install pytest pytest-django

      - name: Run tests
        run: |
          cd project
          pytest --tb=short -v
        env:
          DJANGO_SETTINGS_MODULE: project.settings
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: "True"

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./project
          file: ./project/Dockerfile
          push: false