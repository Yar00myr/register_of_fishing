services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: fishing_register
    command: gunicorn project.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./media:/app/media    
      - ./staticfiles:/app/staticfiles
    ports:
      - "8000:8000"
    environment:
      DEBUG: "False"
      SECRET_KEY: "${SECRET_KEY}"
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_HOST: db

  db:
    image: postgres:17.7
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
