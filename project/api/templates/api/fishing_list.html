{% extends "api/_base.html" %}
{% block content %}
    <h1 class="fishing-trips">Fishing Trips</h1>
    <div class="list-group">
        <ul>
            {% for trip in trips %}
                <li>
                <a 
                href="{% url 'api:fishingtrip-detail' trip.pk %}"
                class="list-group-item list-group-item-action">
                    {{ trip.date }} — {{ trip.country_code }}
                </a>
                </li>
            {% empty %}
                <li>No trips yet.</li>
            {% endfor %}
        </ul>
    </div>
{% endblock %}
