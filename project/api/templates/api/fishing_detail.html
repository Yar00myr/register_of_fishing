{% extends "api/_base.html" %}
{% block content %}
    <div class="d-flex justify-content-center align-items-center">
        <h1>Fishing Trip</h1>
    </div>
    <p><strong>Date:</strong> {{ trip.date }}</p>
    <p><strong>Country:</strong> {{ trip.country_code }}</p>

    <div class="mt-3">
        <a class="btn btn-secondary" href="{% url 'api:fishingtrip-list' %}">← Back to list</a>
        <a class="btn btn-warning" href="{% url 'api:fishingtrip-detail' trip.pk %}">Edit</a>
        <a class="btn btn-secondary" href="#">Add Catch</a>
        <form method="post" action="{% url 'api:fishingtrip-detail' trip.pk %}" style="display:inline;">
            {% csrf_token %}
            <input type="hidden" name="_method" value="delete">
            <button type="submit" class="btn btn-danger">Delete</button>
        </form>
    </div>

    <div>
        <table>
            <caption>Types of fish for fishing</caption>

        <thead>
            <tr>
                <th>Type of fish</th>
                <th>Amount</th>
            </tr>
        </thead>

        <tfoot>
            <th scope="row">Totals</th>
            <td>{{}}</td>
        </tfoot>
        </table>
    </div>
{% endblock %}
