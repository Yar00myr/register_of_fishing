{% extends 'main/_base.html' %}

{% block content %}
<div class="container mt-5">
    <h2>Delete Fishing Trip</h2>
    <p>Are you sure you want to delete the trip to {{ trip.country_name }} on {{ trip.date }}?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'main:fishingtrip-detail' trip.pk %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
