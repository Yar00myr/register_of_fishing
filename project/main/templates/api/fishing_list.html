{% extends "api/_base.html" %}
{% load static %}
 
{% block content %}
    <h1 class="fishing-trips">Fishing Trips</h1>
    <ul class="trip-list">
        {% for trip in trips %}
            <li>
                <a href="{% url 'api:fishingtrip-detail' trip.pk %}" class="list-group-item">
                    <i class="bi bi-calendar3 me-2" style="opacity:.6"></i>
                    {{ trip.date }}
                    <span style="margin:0 .5rem;opacity:.35">·</span>
                    <i class="bi bi-geo-alt me-1" style="opacity:.6"></i>
                    {{ trip.country_code }}
                </a>
            </li>
        {% empty %}
            <li class="empty-message">No trips yet.</li>
        {% endfor %}
    </ul>
{% endblock %}
